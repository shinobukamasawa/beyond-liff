<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>通信経路の比較（実験）</title>
<style>
  body { font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; font-size: 15px; margin: 0; padding: 14px 16px; color: #1c2430; background: #f4f6f9; line-height: 1.6; }
  h1 { font-size: 17px; margin: 0 0 8px; color: #2b5d8c; }
  button { display: block; width: 100%; padding: 13px; margin: 8px 0; border-radius: 10px; border: 1px solid #2b5d8c; background: #2b5d8c; color: #fff; font-size: 16px; font-weight: 700; }
  button.sub { background: #fff; color: #2b5d8c; font-weight: 500; }
  button:disabled { opacity: .5; }
  pre { background: #0b141b; color: #9f9; padding: 10px; border-radius: 8px; font-size: 12px; white-space: pre-wrap; min-height: 120px; }
  p { margin: 6px 0; color: #555; font-size: 13px; }
</style>
</head>
<body>
<h1>通信経路の比較（実験ページ）</h1>
<p>GAS との通信を2つの経路で5回ずつ行い、往復時間を比べます。本番の予約画面とは無関係で、データの読み書きはしません。</p>
<button id="btnBridge">① 新方式（google.script.run）を5回</button>
<button id="btnFetch" class="sub">② 現行方式（fetch → リダイレクト）を5回</button>
<button id="btnBoth" class="sub">③ 交互に5回ずつ（おすすめ）</button>
<pre id="out">準備中…</pre>

<script src="config.js"></script>
<script>
(function () {
  var CFG = window.BEYOND_CONFIG;
  var out = document.getElementById('out');
  var T0 = Date.now();
  function log(s) { out.textContent += '\n' + s; }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  // ---- 新方式：見えない枠 ----
  var bridgeWin = null, bridgeOrigin = '', pending = {}, seq = 0;
  var bridgeReady = new Promise(function (resolve) {
    window.addEventListener('message', function (ev) {
      var m = ev.data || {};
      if (m.type === 'beyond-bridge-ready' && /\.googleusercontent\.com$/.test(new URL(ev.origin).hostname)) {
        bridgeWin = ev.source; bridgeOrigin = ev.origin; resolve(Date.now() - T0);
      } else if (m.type === 'beyond-result' && ev.source === bridgeWin && pending[m.id]) {
        pending[m.id](m.json); delete pending[m.id];
      }
    });
  });
  var frame = document.createElement('iframe');
  frame.src = CFG.apiUrl + '?bridge=1';
  frame.style.cssText = 'width:0;height:0;border:0;position:absolute;left:-9999px';
  document.body.appendChild(frame);

  function callBridge(req, timeoutMs) {
    return bridgeReady.then(function () {
      return new Promise(function (resolve, reject) {
        var id = 'c' + (++seq);
        var timer = setTimeout(function () { delete pending[id]; reject(new Error('timeout')); }, timeoutMs || 30000);
        pending[id] = function (json) { clearTimeout(timer); resolve(JSON.parse(json)); };
        bridgeWin.postMessage({ type: 'beyond-call', id: id, req: req }, bridgeOrigin);
      });
    });
  }
  function callFetch(req) {
    return fetch(CFG.apiUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(req), redirect: 'follow' })
      .then(function (r) { return r.text().then(function (t) { try { return JSON.parse(t); } catch (e) { throw new Error('HTTP' + r.status); } }); });
  }
  function once(label, fn) {
    var t0 = Date.now();
    return fn({ action: 'ping' }).then(function (r) { var ms = Date.now() - t0; log(label + '  ' + ms + 'ms' + (r && r.ok ? '' : ' (応答異常)')); return ms; })
      .catch(function (e) { var ms = Date.now() - t0; log(label + '  ' + ms + 'ms  失敗: ' + e.message); return null; });
  }
  function summary(name, arr) {
    var ok = arr.filter(function (x) { return x !== null; }).sort(function (a, b) { return a - b; });
    log('== ' + name + '：成功 ' + ok.length + '/' + arr.length + (ok.length ? '、中央値 ' + ok[Math.floor(ok.length / 2)] + 'ms、最大 ' + ok[ok.length - 1] + 'ms' : ''));
  }
  function setBusy(b) { ['btnBridge', 'btnFetch', 'btnBoth'].forEach(function (id) { document.getElementById(id).disabled = b; }); }

  async function run(kind) {
    setBusy(true);
    log('--- ' + new Date().toLocaleTimeString() + ' 開始（' + kind + '） ---');
    var a = [], b = [];
    for (var i = 1; i <= 5; i++) {
      if (kind !== 'fetch') a.push(await once('新方式 ' + i + '回目', callBridge));
      if (kind !== 'bridge') b.push(await once('現行   ' + i + '回目', callFetch));
      await sleep(1500);
    }
    if (a.length) summary('新方式（google.script.run）', a);
    if (b.length) summary('現行方式（fetch）', b);
    setBusy(false);
  }
  document.getElementById('btnBridge').addEventListener('click', function () { run('bridge'); });
  document.getElementById('btnFetch').addEventListener('click', function () { run('fetch'); });
  document.getElementById('btnBoth').addEventListener('click', function () { run('both'); });

  setBusy(true);
  out.textContent = '見えない枠（GAS の HTML）を読み込み中…';
  var giveUp = setTimeout(function () { log('30秒たっても枠の準備ができません。新方式はこの環境では使えない可能性があります。②は試せます。'); document.getElementById('btnFetch').disabled = false; }, 30000);
  bridgeReady.then(function (ms) { clearTimeout(giveUp); log('枠の準備完了：' + ms + 'ms（ページを開いてから）'); setBusy(false); });
})();
</script>
</body>
</html>
